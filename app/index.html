<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Coast Cover Studio</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <h1>Neon Coast <span>Cover Studio</span></h1>
    <p class="tagline">Turn your photos into GTA-style cover art. Everything stays on your machine.</p>

    <section class="group" aria-label="Photos">
      <h2>1 · Photos</h2>
      <label class="file-btn">Add photos from your machine
        <input id="photo-input" type="file" accept="image/*" multiple>
      </label>
      <div class="samples">
        <button id="sample-boulevard" type="button">Try sample · Boulevard</button>
        <button id="sample-pier" type="button">Try sample · Pier</button>
      </div>
      <div id="thumbs" class="thumbs" aria-label="Your photos"></div>
      <label class="check"><input id="same-photo" type="checkbox" checked> Same photo in every panel</label>
    </section>

    <section class="group" aria-label="Layout and grade">
      <h2>2 · Layout &amp; grade</h2>
      <div id="layout-pick" class="pick" role="group" aria-label="Layout">
        <button type="button" data-layout="hero" class="active">Hero + Strip</button>
        <button type="button" data-layout="grid">Grid 2×2</button>
        <button type="button" data-layout="triptych">Triptych</button>
        <button type="button" data-layout="poster">Poster</button>
      </div>
      <div id="grade-pick" class="pick" role="group" aria-label="Colour grade">
        <button type="button" data-grade="sunset" class="active">Sunset</button>
        <button type="button" data-grade="neon">Neon</button>
        <button type="button" data-grade="gold">Gold</button>
        <button type="button" data-grade="noir">Noir</button>
      </div>
    </section>

    <section class="group" aria-label="Selected panel">
      <h2>3 · Selected panel</h2>
      <p class="panel-row">
        <button id="panel-prev" type="button" aria-label="Previous panel">‹</button>
        <span id="panel-label">Panel 1 of 4</span>
        <button id="panel-next" type="button" aria-label="Next panel">›</button>
      </p>
      <label>Zoom <input id="zoom" type="range" min="1" max="3" step="0.05" value="1"></label>
      <label>Pan left–right <input id="pan-x" type="range" min="-1" max="1" step="0.01" value="0"></label>
      <label>Pan up–down <input id="pan-y" type="range" min="-1" max="1" step="0.01" value="0"></label>
      <p class="hint">Click a panel to select it, then drag it on the preview to move the photo.</p>
    </section>

    <section class="group" aria-label="Caption">
      <h2>4 · Caption</h2>
      <label>Title <input id="title" type="text" maxlength="32" value="Neon Coast"></label>
      <label>Tagline <input id="subtitle" type="text" maxlength="48" value="Vice City nights"></label>
    </section>

    <section class="group" aria-label="Export">
      <h2>5 · Export</h2>
      <div id="size-pick" class="pick" role="group" aria-label="Export size">
        <button type="button" data-size="1080x1080">1080 × 1080</button>
        <button type="button" data-size="1080x1350">1080 × 1350</button>
        <button type="button" data-size="1920x1080" class="active">1920 × 1080</button>
      </div>
      <button id="export" type="button" class="export">Export PNG</button>
      <p id="status" role="status"></p>
    </section>
  </section>
  <section class="stage" aria-label="Cover preview">
    <canvas id="cover" width="1920" height="1080" aria-label="The cover"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
